# CI/CD for the STACK IT Customer Churn app.
# On every app or terraform push to main:  test -> build & push image to Amazon ECR.
# When this succeeds, terraform.yml runs and rolls the instances onto the
# new :latest image (terraform/user-data.tftpl pulls it at boot).
#
# Repo settings required:
#   Variables:  AWS_REGION, AWS_ACCOUNT_ID, ECR_REPO   (e.g. stackit-churn-app)
#   Auth:       GitHub OIDC -> an IAM role (no long-lived keys). Put the role
#               ARN in `role-to-assume` below; it needs ECR push permissions.

name: ci-cd

on:
  push:
    branches: [ main ]
    paths-ignore:   # packer-only changes go through golden-image.yml instead
      - "packer/**"
      - ".github/workflows/golden-image.yml"
  workflow_dispatch:

permissions:
  id-token: write      # OIDC token for AWS auth
  contents: write      # push the GitOps manifest bump

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPO: ${{ vars.ECR_REPO }}
  IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPO }}

jobs:
  audit:
    uses: ./.github/workflows/ai-audit.yml
    secrets: inherit

  test:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python train/train_model.py     # model builds
      - run: python tests/test_app.py         # smoke tests

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          docker build -t "$IMAGE:${{ steps.meta.outputs.tag }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:latest"

